<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나곡중 영어 표현</title>
  <!-- 테일윈드 CSS 라이브러리 로드 (별도 설치 없이 바로 사용 가능) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2F4F6] text-[#191F28] min-h-screen flex flex-col justify-between antialiased">

  <!-- 상단 헤더 -->
  <header class="p-5 bg-white border-b border-gray-100 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight text-[#3182F6]">Toss English</h1>
    <button id="homeBtn" class="text-sm text-gray-500 hidden">처음으로</button>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="flex-1 flex flex-col items-center justify-center p-6" id="appContent">
    <!-- 자바스크립트가 여기에 화면을 그려줍니다 -->
  </main>

  <!-- 하단 띠 배너 광고 영역 (공간 확보용) -->
  <footer class="w-full bg-gray-200 text-center py-3 text-xs text-gray-400">
    ADVERTISEMENT
  </footer>

  <!-- 앱 로직 스크립트 연결 -->
  <script src="app.js"></script>
</body>
</html>
